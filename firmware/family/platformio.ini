[platformio]
src_dir = src
[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -D CORE_DEBUG_LEVEL=0
[env:devkit-central]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -D NX_PROFILE=\"devkit-central\"
[env:devkit-hub]
extends = env:devkit-central
build_flags = ${env.build_flags} -D NX_PROFILE=\"devkit-hub\" -D NX_HUB=1
[env:s3-central]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -D NX_PROFILE=\"s3-central\" -D NX_S3=1 -D BOARD_HAS_PSRAM -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
[env:s3-hub]
extends = env:s3-central
build_flags = ${env.build_flags} -D NX_PROFILE=\"s3-hub\" -D NX_S3=1 -D BOARD_HAS_PSRAM -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D NX_HUB=1
[env:devkit-slave]
board = esp32dev
build_src_filter = +<slave.cpp>
build_flags = ${env.build_flags} -D NX_PROFILE=\"devkit-slave\"
[env:c3-slave]
board = esp32-c3-devkitm-1
build_src_filter = +<slave.cpp>
build_flags = ${env.build_flags} -D NX_PROFILE=\"c3-slave\" -D NX_C3=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
