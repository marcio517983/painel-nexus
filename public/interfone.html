<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusMaster | Interfone Virtual</title><meta name="theme-color" content="#102740"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#ebf3fa;background:#0b1524}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#193954,#0b1524 65%)}main{width:min(460px,100%);padding:28px;border:1px solid #2c4256;border-radius:22px;background:#13263a;box-shadow:0 25px 65px #0005}.brand{letter-spacing:.14em;text-align:center;font-weight:850;font-size:20px;color:#d9efff}.brand span{display:block;font-size:11px;font-weight:500;color:#78a8c7;letter-spacing:.3em;margin-top:5px}h1{text-align:center;font-size:23px;margin:29px 0 6px}p{text-align:center;color:#a5b6c6;line-height:1.5}label{display:block;font-size:13px;margin:20px 0 7px;color:#b7d0df}select,button{width:100%;border-radius:12px;padding:14px 12px;font:inherit}select{color:#ebf3fa;background:#0c1e30;border:1px solid #3f5a70}button{background:#3c99db;color:white;font-weight:750;border:0;margin-top:22px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;border:1px solid #597089}.hidden{display:none}.disc{margin:24px auto 8px;width:85px;height:85px;border-radius:50%;display:grid;place-items:center;background:#1b4661;font-size:34px}.status{text-align:center;font-weight:700}.details{font-size:14px}.foot{font-size:12px;margin-top:25px}#notice{min-height:22px;color:#ffc5af}</style></head><body><main><div class="brand">◈ NEXUSMASTER<span>INTERFONE VIRTUAL</span></div>
<section id="start"><h1 id="place">Bem-vindo!</h1><p>Selecione a residência que deseja chamar.</p><label for="unit">Apartamento ou casa</label><select id="unit"><option value="">Carregando unidades...</option></select><label for="reason">Qual o motivo da visita?</label><select id="reason"><option value="entrega">Entrega / Encomenda</option><option value="visita">Visita pessoal</option><option value="servico">Prestação de serviço</option><option value="outro">Outro assunto</option></select><button id="call" disabled>☎ Chamar residência</button></section>
<section id="calling" class="hidden"><div class="disc" id="symbol">☎</div><h1 id="title">Chamando...</h1><p id="sub">Aguarde enquanto chamamos o morador.</p><div id="clock" class="status">00:30</div><button class="secondary" id="cancel">Encerrar</button></section>
<p id="notice" role="status"></p><p class="foot">NexusMaster • Não fornece chamadas de emergência. Esta versão testa sinalização, sem áudio ao vivo.</p></main><script type="module" src="/interfone.js"></script></body></html>
